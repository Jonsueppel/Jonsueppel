name: Update CISA Security Pulse

on:
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * *"

permissions:
  contents: write

concurrency:
  group: security-pulse
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download official CISA KEV data
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://raw.githubusercontent.com/cisagov/kev-data/develop/known_exploited_vulnerabilities.json \
            --output kev-data.json

      - name: Generate Security Pulse
        run: python3 scripts/generate_security_pulse.py kev-data.json assets/security-pulse.svg

      - name: Publish changes
        run: |
          rm kev-data.json
          if git diff --quiet -- assets/security-pulse.svg; then
            echo "Security Pulse is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/security-pulse.svg
          git commit -m "Update CISA Security Pulse"
          git push
