<svg width="900" height="190" viewBox="0 0 900 190" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jonathon Sueppel, Senior Infrastructure Engineer">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071109"/>
      <stop offset="0.52" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238636"/>
      <stop offset="0.5" stop-color="#6dff69"/>
      <stop offset="1" stop-color="#238636"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .name { font: 700 31px 'Segoe UI',Inter,Arial,sans-serif; fill: #f0f6fc; letter-spacing: .4px; }
      .role { font: 600 15px 'Segoe UI',Inter,Arial,sans-serif; fill: #8effa0; letter-spacing: .5px; }
      .meta { font: 500 12px 'JetBrains Mono',Consolas,monospace; fill: #8b949e; letter-spacing: .55px; }
      .terminal { font: 700 19px 'JetBrains Mono',Consolas,monospace; fill: #6dff69; }
      .node { fill: #0d1117; stroke: #51ff4a; stroke-width: 1.2; }
      .path { fill: none; stroke: #238636; stroke-width: 1; stroke-dasharray: 4 5; opacity: .72; }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      .pulse-a { animation: pulse 2.4s ease-in-out infinite; }
      .pulse-b { animation: pulse 2.4s ease-in-out 1.2s infinite; }
      .flow { animation: flow 2.6s linear infinite; }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="188" rx="10" fill="url(#background)" stroke="#238636" stroke-width="1.2"/>
  <rect x="1" y="1" width="898" height="3" rx="2" fill="url(#accent)"/>

  <path class="path flow" d="M55 61 H111 V40 H165"/>
  <path class="path flow" d="M55 95 H128 V119 H177"/>
  <path class="path flow" d="M75 151 H118 V143 H163"/>
  <circle class="node pulse-a" cx="48" cy="61" r="7"/>
  <rect class="node pulse-b" x="43" y="87" width="14" height="14" rx="2"/>
  <circle class="node pulse-a" cx="68" cy="151" r="7"/>
  <circle class="node pulse-b" cx="172" cy="40" r="7"/>
  <rect class="node pulse-a" x="170" y="112" width="14" height="14" rx="2"/>
  <circle class="node pulse-b" cx="170" cy="143" r="7"/>

  <path class="path flow" d="M735 43 H782 V68 H846"/>
  <path class="path flow" d="M724 97 H804 V119 H852"/>
  <path class="path flow" d="M742 148 H792 V145 H836"/>
  <circle class="node pulse-b" cx="728" cy="43" r="7"/>
  <rect class="node pulse-a" x="717" y="90" width="14" height="14" rx="2"/>
  <circle class="node pulse-b" cx="735" cy="148" r="7"/>
  <circle class="node pulse-a" cx="853" cy="68" r="7"/>
  <rect class="node pulse-b" x="845" y="112" width="14" height="14" rx="2"/>
  <circle class="node pulse-a" cx="843" cy="145" r="7"/>

  <rect x="243" y="30" width="42" height="42" rx="7" fill="#08170a" stroke="#51ff4a" stroke-width="1.3" filter="url(#softGlow)"/>
  <text x="253" y="57" class="terminal">&gt;_</text>

  <text x="302" y="54" class="name">Jonathon Sueppel</text>
  <text x="243" y="88" class="role">Senior Infrastructure Engineer</text>
  <text x="243" y="116" class="meta">MICROSOFT CLOUD  /  SECURITY  /  AUTOMATION  /  HOMELAB</text>
  <line x1="243" y1="132" x2="657" y2="132" stroke="#238636" stroke-width="1"/>
  <text x="243" y="157" class="meta">14+ YEARS IN IT  •  SHELBY, NORTH CAROLINA</text>
</svg>
